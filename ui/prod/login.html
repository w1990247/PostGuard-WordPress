<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>PostGuard-WordPress Login</title>
    <link rel="stylesheet" href="/assets/app.css"/>
</head>

<body>
    <div class="wrap">

        <div class="card">

            <div class="topbar">
                <div>
                <div style="font-size: 22px;font-weight:800;">PostGuard-Wordpress</div>
                <div class="muted">Login to continue</div>
                </div>
                <span class="badge">/ (prod)</span>
            </div>
            
            <label>Email</label>
            <input id="email" autocomplete="username"/>
            <label style="margin-top: 10px;">Password</label>
            <input id="pass" type="password" autocomplete="username"/>
            
            <div style="display: flex;gap:10px;margin-top:14px;">
            <button id="buttonLogin">Login</button>
            <button class="secondary" id="buttonRegister">Register (invite)</button>
            </div>

            <div id="out" class="err" style="margin-top: 12px;"></div>
        </div>
    </div>

    <script type="module">
        import { setToken } from "/assets/app.js";

        document.getElementById("buttonRegister").onclick=()=> {
            location.href= "/register.html";
        };

        document.getElementById("buttonLogin").onclick= async()=> {

            const out= document.getElementById("out");
            out.textContent="";
            const body =new URLSearchParams();
            body.set("username", document.getElementById("email").value);
            body.set("password", document.getElementById("pass").value);

            try{
                const res= await fetch("/api/auth/login",{
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.detail|| "Login failed");
                setToken(data.access_token);
                location.href= "/";
            }
            catch (e){
                out.textContent= e.message;
            }
        };
    </script>

</body>

</html>
